name: release

# Builds Linux binaries for the common architectures and publishes them as a
# GitHub release whenever a version tag is pushed. Versioning: stable releases
# are `x.y.z` (e.g. v1.0.0); suffixed tags (e.g. v1.0.1-beta) publish as
# prereleases. Binaries are glibc-linked (gnu); the Docker image is the fully
# static musl build (built separately in Alpine).
#
#   git tag v1.0.0 && git push origin v1.0.0            # stable
#   git tag v1.0.1-beta && git push origin v1.0.1-beta  # prerelease
#
# Also runnable via workflow_dispatch to build artifacts without publishing.
#
# Needs no repo secrets: GITHUB_TOKEN is provided by Actions, and
# `contents: write` lets the workflow create the release and upload assets.
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Install cross targets and toolchains
        run: |
          rustup target add \
            x86_64-unknown-linux-gnu \
            aarch64-unknown-linux-gnu \
            armv7-unknown-linux-gnueabihf \
            i686-unknown-linux-gnu
          sudo apt-get update
          sudo apt-get install -y \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabihf gcc-i686-linux-gnu

      - name: Run tests
        run: cargo test --workspace --locked

      - name: Build release artifacts
        env:
          VERSION: ${{ github.ref_name }}
        run: bash scripts/build-release.sh

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          ls -la dist/
          args=()
          case "$TAG" in
            *-beta|*-rc|*-alpha) args+=(--prerelease) ;;
          esac
          gh release create "$TAG" dist/*.tar.gz dist/SHA256SUMS \
            -R "$REPO" \
            --title "$TAG" \
            --generate-notes \
            "${args[@]}"

  image:
    runs-on: ubuntu-latest
    needs: release
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}},value=${{ github.ref_name }}
            type=semver,pattern={{major}}.{{minor}},value=${{ github.ref_name }}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
