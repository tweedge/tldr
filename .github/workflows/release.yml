name: release

# Builds static Linux binaries for the common architectures and publishes them
# as a GitHub release whenever a version tag is pushed. Versioning: stable
# releases are `x.y.z` (e.g. v1.0.0); suffixed tags (e.g. v1.0.1-beta) publish
# as prereleases.
#
#   git tag v1.0.0 && git push origin v1.0.0            # stable
#   git tag v1.0.1-beta && git push origin v1.0.1-beta  # prerelease
#
# Needs no repo secrets: GITHUB_TOKEN is provided by Actions, and
# `contents: write` lets the workflow create the release and upload assets.
on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Install cross targets and musl toolchain
        run: |
          rustup target add \
            x86_64-unknown-linux-musl \
            aarch64-unknown-linux-musl \
            armv7-unknown-linux-musleabihf \
            i686-unknown-linux-musl
          sudo apt-get update
          sudo apt-get install -y musl-tools \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabihf gcc-i686-linux-gnu

      - name: Run tests
        run: cargo test --workspace --locked

      - name: Build release artifacts
        env:
          VERSION: ${{ github.ref_name }}
        run: bash scripts/build-release.sh

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          ls -la dist/
          args=()
          case "$TAG" in
            *-beta|*-rc|*-alpha) args+=(--prerelease) ;;
          esac
          gh release create "$TAG" dist/*.tar.gz dist/SHA256SUMS \
            -R "$REPO" \
            --title "$TAG" \
            --generate-notes \
            "${args[@]}"
