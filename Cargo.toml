[package]
name = "tldr"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Continuously updated historical DNS zone-transfer archive for root and TLD zones"
license = "GPL-3.0-only"
readme = "README.md"

[workspace]
members = ["crates/tldr-core"]
resolver = "2"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4.5", features = ["derive"] }
hickory-proto = { version = "0.26", features = ["dnssec-ring"] }
hickory-resolver = { version = "0.26", default-features = false, features = ["tokio", "https-ring", "webpki-roots"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time", "fs", "io-util"] }
tokio-socks = "0.5"
toml = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tldr-core = { path = "crates/tldr-core" }
zstd = "0.13"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1
strip = true
