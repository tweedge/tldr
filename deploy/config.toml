[archive]
path = "/home/ubuntu/tldr-deploy/data/archive"
retention_days = 30
compression_level = 19

[scan]
# cybersecurity.theater has a clean path to port 53, so transfers go direct.
# Concurrency is bounded to be polite to authoritative servers; pacing is 0
# because it serializes the spawn loop.
concurrency = 12
timeout_secs = 20
pacing_ms = 0
max_servers_per_zone = 6
include_root = true

[diff]
notify_floor = "high"

[notify]
enabled = true
app_token_env = "PUSHOVER_APP_TOKEN"
user_token_env = "PUSHOVER_USER_TOKEN"
title = "TLDR"
# device = "phone"          # optional: target a single Pushover device
# priority = 0              # optional: -2..=2; unset uses the app default
message_max_chars = 1000
dry_run = false

[report]
zones_md = "/home/ubuntu/tldr-deploy/data/ZONES.md"
